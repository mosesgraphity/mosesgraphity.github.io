<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Live Église · Affichage</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Mont;font-weight:500;src:url(../assets/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Mont;font-weight:600;src:url(../assets/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Mont;font-weight:700;src:url(../assets/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Mont;font-weight:800;src:url(../assets/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:600;src:url(fonts/lora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:700;src:url(fonts/lora-latin-700-normal.woff2) format('woff2')}
:root{--acc:#3E6FF0;--d:.6s;--ink:#0b1430}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:Mont,Arial,sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased}

/* ================= FONDS ================= */
#bg{position:absolute;inset:0;opacity:0;transition:opacity var(--d) ease}
#bg.on{opacity:1}
.fond{position:absolute;inset:0;overflow:hidden;background:#0b1430}
.fond>*{position:absolute}
.f-noir{background:#000}
.f-uni{background:radial-gradient(ellipse at 50% 0%,#18295e 0%,#0b1430 60%,#070d22 100%)}
.f-uni .grain,.f-grille .grain{inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px);background-size:7px 7px}
.f-aube{background:linear-gradient(160deg,#1b0f2e 0%,#3a1c3f 45%,#a8543a 100%)}
.f-lumiere .b1,.f-lumiere .b2{width:1400px;height:1400px;border-radius:50%;filter:blur(140px);opacity:.55}
.f-lumiere .b1{background:var(--acc);left:-400px;top:-500px;animation:drift 18s ease-in-out infinite alternate}
.f-lumiere .b2{background:#7a4dd8;right:-500px;bottom:-600px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(260px,180px) scale(1.15)}}
.f-rayons{background:radial-gradient(ellipse at 50% -10%,#1d3270 0%,#0b1430 55%,#060b1d 100%)}
.f-rayons .r{left:50%;top:-1500px;width:3000px;height:3000px;margin-left:-1500px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.075) 0deg 4deg,rgba(255,255,255,0) 4deg 12deg);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);animation:spin 120s linear infinite}
.f-rayons .g{left:50%;top:-420px;width:1300px;height:900px;margin-left:-650px;border-radius:50%;background:var(--acc);filter:blur(160px);opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.f-bokeh{background:linear-gradient(180deg,#0a1129 0%,#101a3e 100%)}
.f-bokeh i{border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:float linear infinite;opacity:.0}
.f-bokeh i.c{background:radial-gradient(circle,var(--acc),transparent 70%)}
@keyframes float{0%{transform:translateY(80px);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.f-vagues{background:linear-gradient(180deg,#081028 0%,#0d1a44 100%)}
.f-vagues svg{left:0;bottom:0;width:3840px;height:640px;animation:wave linear infinite}
.f-vagues svg:nth-of-type(1){animation-duration:38s;opacity:.55}
.f-vagues svg:nth-of-type(2){animation-duration:26s;opacity:.35;bottom:-40px}
.f-vagues svg:nth-of-type(3){animation-duration:52s;opacity:.25;bottom:60px}
.f-vagues .g{left:-200px;top:-300px;width:1200px;height:900px;border-radius:50%;background:var(--acc);filter:blur(170px);opacity:.35}
@keyframes wave{to{transform:translateX(-1920px)}}
.f-grille{background:#070d22}
.f-grille .l{inset:-120px;background-image:linear-gradient(rgba(120,150,255,.09) 2px,transparent 2px),linear-gradient(90deg,rgba(120,150,255,.09) 2px,transparent 2px);background-size:120px 120px;animation:pan 30s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 20%,transparent 75%)}
.f-grille .g{left:50%;top:50%;width:1100px;height:800px;margin:-400px 0 0 -550px;border-radius:50%;background:var(--acc);filter:blur(180px);opacity:.4}
@keyframes pan{to{transform:translate(120px,120px)}}
.f-image .im{inset:0;background-size:cover;background-position:center}
.f-image .sh{inset:0;background:linear-gradient(180deg,rgba(5,10,28,.55),rgba(5,10,28,.75))}

/* ================= PLEIN ÉCRAN ================= */
#fs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:110px 170px}
#fs .box{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:1580px}
#fs .k{font:800 30px Mont;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);filter:brightness(1.4);margin-bottom:30px}
#fs .t{font:900 112px/1.04 Mont;letter-spacing:-.025em}
#fs .s{font:600 46px/1.3 Mont;color:rgba(255,255,255,.85);margin-top:28px}
#fs .line{width:130px;height:6px;background:var(--acc);margin-top:40px}
#fs.verset .t{font:700 76px/1.36 Lora;letter-spacing:0;text-shadow:0 2px 24px rgba(0,0,0,.35)}
#fs.verset .t sup{font:900 .42em Mont;color:var(--acc);filter:brightness(1.45);vertical-align:.95em;margin:0 .22em 0 .1em}
#fs.verset .s{font:900 40px Mont;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-top:48px;display:flex;align-items:center;gap:26px}
#fs.verset .s:before,#fs.verset .s:after{content:"";width:80px;height:5px;background:var(--acc)}
#fs.verset .line,#fs.verset .k{display:none}
#fs.f-editorial.verset{justify-content:flex-start;padding-left:200px}
#fs.f-editorial.verset .box{align-items:flex-start;text-align:left;max-width:1480px}
#fs.f-editorial.verset .box:before{content:"“";font:700 300px/1 Lora;color:var(--acc);filter:brightness(1.3);height:150px;margin:-40px 0 10px -12px}
#fs.f-editorial.verset .s:after{display:none}
#fs.f-carte.verset .box{background:#fff;color:var(--ink);border-radius:30px;padding:90px 110px 80px;box-shadow:0 40px 120px rgba(0,0,0,.45);max-width:1560px}
#fs.f-carte.verset .t{text-shadow:none;color:var(--ink)}
#fs.f-carte.verset .t sup{filter:none}
#fs.f-carte.verset .s{background:var(--acc);color:#fff;padding:16px 36px;border-radius:999px;font-size:34px;margin-top:50px}
#fs.f-carte.verset .s:before,#fs.f-carte.verset .s:after{display:none}

/* ================= BANDEAU ================= */
#lt{position:absolute;left:120px;bottom:100px}
body.pos-centre #lt{left:50%;transform:translateX(-50%)}
#lt .card{display:flex;align-items:stretch;position:relative}
#lt .tag,#lt .bar{display:none}
#lt .in{display:flex;flex-direction:column;justify-content:center}
#lt .l1{font:800 56px/1.1 Mont;letter-spacing:-.01em}
#lt .l2{font:600 30px/1.3 Mont;margin-top:8px}
#lt.verset .in{width:1600px}
#lt.verset .l1{font:700 44px/1.36 Lora;letter-spacing:0}
#lt.verset .l2{font:900 30px Mont;letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
body.pos-centre #lt .in{align-items:center;text-align:center}

/* 1 · Moderne */
#lt.m-moderne .card{background:rgba(8,14,34,.92)}
#lt.m-moderne .bar{display:block;width:12px;background:var(--acc)}
#lt.m-moderne .in{padding:26px 46px 28px 34px}
#lt.m-moderne .l2{opacity:.85}
#lt.m-moderne.verset .l2{color:var(--acc);filter:brightness(1.5);opacity:1}

/* 2 · Ruban */
#lt.m-ruban .in{align-items:flex-start}
body.pos-centre #lt.m-ruban .in{align-items:center}
#lt.m-ruban .l1{background:var(--acc);padding:16px 32px 14px;font-weight:900;text-transform:uppercase;letter-spacing:.005em;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#lt.m-ruban .l2{background:#fff;color:var(--ink);padding:11px 32px 12px;margin:0 0 0 32px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
body.pos-centre #lt.m-ruban .l2{margin-left:0}
#lt.m-ruban.verset .l1{order:2;background:#fff;color:var(--ink);text-transform:none;font:700 42px/1.38 Lora;padding:26px 36px 28px}
#lt.m-ruban.verset .l2{order:1;background:var(--acc);color:#fff;margin:0;padding:12px 26px;font-size:26px}

/* 3 · Cadre */
#lt.m-cadre .card{background:rgba(6,12,30,.78);outline:2px solid rgba(255,255,255,.22);outline-offset:-2px}
#lt.m-cadre .card:before,#lt.m-cadre .card:after{content:"";position:absolute;width:46px;height:46px;border:6px solid var(--acc)}
#lt.m-cadre .card:before{left:-10px;top:-10px;border-right:0;border-bottom:0}
#lt.m-cadre .card:after{right:-10px;bottom:-10px;border-left:0;border-top:0}
#lt.m-cadre .in{padding:30px 50px 32px}
#lt.m-cadre .l2{color:var(--acc);filter:brightness(1.5);font-weight:700;letter-spacing:.02em}
#lt.m-cadre.verset .l2{letter-spacing:.1em}

/* 4 · Éditorial (pleine largeur) */
#lt.m-editorial{left:0!important;right:0;bottom:0;transform:none!important;padding:170px 130px 96px;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,0) 100%)}
#lt.m-editorial .in{align-items:flex-start!important;text-align:left!important}
#lt.m-editorial .l1{font-weight:900;font-size:76px;letter-spacing:-.02em;text-shadow:0 4px 20px rgba(0,0,0,.4)}
#lt.m-editorial .l2{display:flex;align-items:center;gap:20px;font:800 28px Mont;letter-spacing:.24em;text-transform:uppercase;margin-top:16px}
#lt.m-editorial .l2:before{content:"";width:64px;height:5px;background:var(--acc);flex:none}
#lt.m-editorial.verset .in{width:1640px}
#lt.m-editorial.verset .l1{font:700 50px/1.34 Lora;letter-spacing:0}
#lt.m-editorial.verset .l2{color:#fff;letter-spacing:.14em}

/* 5 · Bande TV (pleine largeur) */
#lt.m-bande{left:0!important;right:0;bottom:70px;transform:none!important}
#lt.m-bande .card{background:rgba(8,14,34,.95);min-height:128px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
#lt.m-bande .tag{display:flex;align-items:center;background:var(--acc);padding:0 70px 0 130px;font:900 30px Mont;letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);white-space:nowrap}
#lt.m-bande .in{padding:22px 50px 24px 30px;align-items:flex-start!important;text-align:left!important;flex:1}
#lt.m-bande .l1{font-size:52px}
#lt.m-bande .l2{opacity:.82}
#lt.m-bande.verset .in{width:auto}
#lt.m-bande.verset .l1{font:700 40px/1.36 Lora}
#lt.m-bande.verset .l2{color:var(--acc);filter:brightness(1.5);opacity:1}

/* 6 · Clair */
#lt.m-clair .card{background:#fff;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.3)}
#lt.m-clair .bar{display:block;width:12px;background:var(--acc)}
#lt.m-clair .in{padding:26px 46px 28px 34px}
#lt.m-clair .l2{color:#4a5470}
#lt.m-clair.verset .l2{color:var(--acc)}

/* 7 · Capsule */
#lt.m-capsule .card{background:#fff;color:var(--ink);border-radius:999px;padding:14px 56px 14px 14px;align-items:center;gap:26px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#lt.m-capsule .tag{display:grid;place-items:center;flex:none;width:104px;height:104px;border-radius:50%;background:var(--acc);color:#fff;font:900 40px Mont;letter-spacing:.02em}
#lt.m-capsule .tag svg{width:50px;height:50px}
#lt.m-capsule .in{align-items:flex-start!important;text-align:left!important}
#lt.m-capsule .l1{font-size:48px}
#lt.m-capsule .l2{color:#4a5470;margin-top:4px}
#lt.m-capsule.verset .card{border-radius:64px;padding:26px 56px 26px 26px}
#lt.m-capsule.verset .in{width:1420px}
#lt.m-capsule.verset .l2{color:var(--acc)}

/* 8 · Minimal */
#lt.m-minimal .in{text-shadow:0 3px 18px rgba(0,0,0,.9),0 1px 4px rgba(0,0,0,.9)}
#lt.m-minimal .l1{font-weight:900;font-size:62px}
#lt.m-minimal .l2:before{content:"";display:block;width:90px;height:6px;background:var(--acc);margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
body.pos-centre #lt.m-minimal .l2:before{margin:14px auto}
#lt.m-minimal.verset .l1{font-size:48px}

/* ================= HABILLAGE CAMÉRAS ================= */
#ov{position:absolute;inset:0}
#ov .ovbg{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#ov .ring{position:absolute;border-radius:22px;box-shadow:0 0 0 5px var(--acc),0 30px 80px rgba(0,0,0,.55)}
#ov .ring.alt{box-shadow:0 0 0 4px rgba(255,255,255,.22),0 30px 80px rgba(0,0,0,.55)}
#ov .ring.rond{border-radius:50%}
#ov .top{position:absolute;top:44px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center;font:800 24px Mont;letter-spacing:.16em;text-transform:uppercase}
#ov .top em{font-style:normal;display:flex;align-items:center;gap:12px}
#ov .top em.dot:before{content:"";width:14px;height:14px;border-radius:50%;background:#e53935;animation:pulse 1.8s infinite}
#ov .top small{font:600 22px Mont;letter-spacing:.12em;opacity:.8}
#ov .nt{position:absolute;display:flex;align-items:stretch;box-shadow:0 14px 40px rgba(0,0,0,.4)}
#ov .nt i{width:10px;background:var(--acc)}
#ov .nt div{background:#fff;color:var(--ink);padding:14px 28px 15px}
#ov .nt b{display:block;font:900 36px/1.1 Mont}
#ov .nt span{display:block;font:600 22px Mont;color:#4a5470;margin-top:3px}
#ov .vp{position:absolute;display:flex;flex-direction:column;justify-content:center}
#ov .vp .q{font:700 150px/1 Lora;color:var(--acc);filter:brightness(1.3);height:80px}
#ov .vp p{font:700 52px/1.36 Lora;text-shadow:0 2px 20px rgba(0,0,0,.3)}
#ov .vp .r{margin-top:34px;font:900 32px Mont;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:18px}
#ov .vp .r:before{content:"";width:64px;height:6px;background:var(--acc)}
#ov .ic{position:absolute;background:#fff;color:var(--ink);border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:0 50px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#ov .ic small{font:800 22px Mont;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
#ov .ic b{font:900 58px/1.08 Mont;margin-top:12px}
#ov .ic span{font:600 26px Mont;color:#4a5470;margin-top:12px}

/* ================= THÈME ================= */
#th{position:absolute;left:70px;top:40px;max-width:1150px;display:flex;align-items:stretch;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#th i{width:9px;flex:none;background:var(--acc)}
#th div{background:rgba(8,14,34,.9);padding:14px 30px 17px}
#th small{display:block;font:800 19px Mont;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);filter:brightness(1.55)}
#th b{display:block;font:900 38px/1.15 Mont;margin-top:5px}
body.th-on #ov .top em{visibility:hidden}
/* ================= BANDEAU DÉFILANT ================= */
#tk{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;background:rgba(8,14,34,.96);box-shadow:0 -8px 30px rgba(0,0,0,.3);transform:translateY(100%);transition:transform var(--d) cubic-bezier(.2,.8,.2,1),opacity var(--d),visibility 0s linear var(--d)}
#tk.show{transform:none;transition:transform var(--d) cubic-bezier(.2,.8,.2,1),opacity var(--d),visibility 0s}
#tk .lab{flex:none;display:flex;align-items:center;padding:0 60px 0 56px;background:var(--acc);font:900 25px Mont;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%);white-space:nowrap}
#tk .vp{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent 100%)}
#tk .run{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;font:700 31px Mont;will-change:transform;animation:tick linear infinite}
#tk .run span{display:inline-flex;align-items:center}
#tk .run span:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--acc);margin:0 40px;filter:brightness(1.3)}
#tk .run b{font-weight:900;color:var(--acc);filter:brightness(1.5);margin-right:14px;text-transform:uppercase;letter-spacing:.06em}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body.tk-on #lt{bottom:178px}
body.tk-on #lt.m-bande{bottom:140px}
body.tk-on #lt.m-editorial{bottom:70px}
/* ================= ATTENTE ================= */
#fs .lg,#fs .cd{display:none}
#fs.attente .lg{display:block;margin-bottom:36px}
#fs.attente .lg img{height:220px;width:auto;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
#fs.attente .t{font-size:84px}
#fs.attente .cd{display:block;font:900 210px/1 Mont;letter-spacing:-.02em;margin-top:26px;font-variant-numeric:tabular-nums;text-shadow:0 10px 40px rgba(0,0,0,.35)}
#fs.attente .line{display:none}
/* ================= LOGO DANS LE COIN ================= */
#bug img{height:92px;width:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
#ov .top em img{height:64px;width:auto;margin-right:6px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
/* ================= DÉMO ================= */
#demo{position:absolute;inset:0;pointer-events:none;display:none}
#demo.on{display:block}
#demo .p{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 24px;font:800 20px Mont;letter-spacing:.08em;white-space:nowrap}
#demo .w{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-24deg);font:900 230px Mont;letter-spacing:.06em;color:rgba(255,255,255,.07);white-space:nowrap}

/* ================= COIN ================= */
#bug{position:absolute;top:50px;right:70px;display:flex;align-items:center;gap:14px;font:800 26px Mont;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#bug i{width:14px;height:14px;border-radius:50%;background:#e53935;animation:pulse 1.8s infinite}
#bug.nolive i{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)}70%{box-shadow:0 0 0 14px rgba(229,57,53,0)}}

/* ================= TRANSITIONS ================= */
.layer{opacity:0;visibility:hidden;transition:opacity var(--d) ease,visibility 0s linear var(--d)}
.layer.show{opacity:1;visibility:visible;transition:opacity var(--d) ease,visibility 0s}
.tr-glisse #lt .card{transform:translateX(-70px);clip-path:inset(-60px 100% -60px -60px);transition:transform var(--d) cubic-bezier(.2,.8,.2,1),clip-path var(--d) cubic-bezier(.2,.8,.2,1)}
.tr-glisse #lt.show .card{transform:none;clip-path:inset(-60px -60px -60px -60px)}
.tr-glisse #fs .box{transform:translateY(46px);transition:transform var(--d) cubic-bezier(.2,.8,.2,1)}
.tr-glisse #fs.show .box{transform:none}
.tr-zoom #lt .card,.tr-zoom #fs .box{transform:scale(.9);transition:transform var(--d) cubic-bezier(.2,.8,.2,1)}
.tr-zoom #lt.show .card,.tr-zoom #fs.show .box{transform:none}
</style>
</head>
<body class="tr-fondu">
<div id="ov" class="layer"><div class="ovbg"><div class="fond"></div></div><div class="ovfx"></div></div>
<div id="th" class="layer"><i></i><div><small></small><b></b></div></div>
<div id="bug" class="layer"><i></i><span></span></div>
<div id="tk"><div class="lab"></div><div class="vp"><div class="run"></div></div></div>
<div id="lt" class="layer"><div class="card"><div class="tag"></div><div class="bar"></div><div class="in"><div class="l1"></div><div class="l2"></div></div></div></div>
<div id="bg"><div class="fond"></div></div>
<div id="fs" class="layer"><div class="box"><div class="lg"></div><div class="k"></div><div class="t"></div><div class="cd"></div><div class="s"></div><div class="line"></div></div></div>
<div id="demo"><div class="w">DÉMO</div><div class="p">VERSION DÉMO · Live Église · MOSES GRAPHITY · 64 37 95 97</div></div>
<script src="noble.min.js"></script>
<script>
(function(){
var KEY='mg-live-eglise',B=document.body,$=function(i){return document.getElementById(i)};
var BOOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/></svg>';
var last=0,cur={lt:{},fs:{}},timers={};
